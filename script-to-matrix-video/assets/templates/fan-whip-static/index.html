 <script>
 // Text is deliberately not targeted by any animation. Picture-only motion.
 const tl=gsap.timeline({paused:true});

 tl.set('#fan',{opacity:1},50/30);
 document.querySelectorAll('.petal').forEach((el,i)=>{
  const angle=(i-2.5)*31;
  tl.fromTo(el,{rotation:24,scale:0.7,x:0,y:0},{rotation:angle,scale:0.82,x:(i-2.5)*28,y:-60,duration:8/30,ease:'power3.out'},50/30);

 });
 tl.set('#opening',{opacity:0},54/30);
 // Incoming full image overtakes the fan, leaving no white wash or black hole.
 tl.set('#shot1',{opacity:1,zIndex:15},64/30);
 tl.fromTo('#shot1',{scale:0.56},{scale:1,duration:10/30,ease:'power3.out'},64/30);
 tl.set('#fan',{opacity:0},71/30);
 tl.fromTo('#visual1',{scale:1.05},{scale:1.14,duration:2,ease:'none'},74/30);
 // Paired push handoffs: both pictures move on the same beat.
 function whip(a,b,t,axis,extent){
  tl.set(b,{opacity:1,zIndex:20},t);
  tl.fromTo(a,{[axis]:0},{[axis]:-extent,duration:10/30,ease:'power4.inOut',immediateRender:false},t);
  tl.fromTo(b,{[axis]:extent},{[axis]:0,duration:10/30,ease:'power4.inOut'},t);
  tl.set(a,{opacity:0},t+10/30);
 }
 whip('#shot1','#shot2',122/30,'x',1080);
 tl.fromTo('#visual2',{scale:1.2},{scale:1.02,duration:2.1,ease:'power2.out'},122/30);
 // Scale/wipe geometry adapted from the installed zoom-through-transition.
 function zoom(a,b,t,reverse){
  tl.set(b,{opacity:1,zIndex:22},t);
  tl.fromTo(b,{clipPath:'inset(0% 100% 0% 0%)',scale:reverse?1.5:0.72},{clipPath:'inset(0% 0% 0% 0%)',scale:1,duration:11/30,ease:'power3.inOut'},t);
  tl.fromTo(a,{scale:1},{scale:reverse?0.78:1.55,duration:11/30,ease:'power3.inOut',immediateRender:false},t);
  tl.set(a,{opacity:0},t+11/30);
 }
 zoom('#shot2','#shot3',185/30,false);

 whip('#shot3','#shot4',248/30,'y',1920);

 zoom('#shot4','#shot5',311/30,true);
 tl.fromTo('#visual5',{scale:1.04},{scale:1.12,duration:66/30,ease:'none'},311/30);
 window.__timelines=window.__timelines||{};
 window.__timelines.main=tl;
