  <script>
    (() => {
      const tl = gsap.timeline({ paused:true });
      // Twelve real, identically-seeked video regions. Their non-timed crop wrappers
      // keep the video timing flat, while the base footage fills transient edge gaps.
      const amplitudes = [-96,76,-52,44,-72,56,-88,64,-112,84,-120,100];
      const samples = [
        {f:0,m:1},{f:1,m:-0.55},{f:2,m:0.36},
        {f:3,m:-0.2},{f:4,m:0.08},{f:6,m:0}
      ];
      amplitudes.forEach((amplitude,index) => {
        const selector="#strip-main-04-band-"+String(index+1).padStart(2,"0");
        tl.set(selector, {x:amplitude}, 0);
        for (let i=1;i<samples.length;i+=1) {
          const previous=samples[i-1], next=samples[i];
          tl.fromTo(selector, {x:amplitude*previous.m},
            {x:amplitude*next.m,duration:(next.f-previous.f)/30,ease:"none",immediateRender:false},
            previous.f/30);
        }
      });
      // Paired cyan/magenta boundaries match the observed 12-band structure.
      // Values describe edge intensity, never an opaque black shutter.
      tl.fromTo("#strip-main-04-scan-boundaries", {opacity:0.06},
        {opacity:1,duration:5/30,ease:"power1.in",immediateRender:false}, 0);
      tl.fromTo("#strip-main-04-scan-boundaries", {opacity:1},
        {opacity:0,duration:10/30,ease:"power1.out",immediateRender:false}, 14/30);
      tl.set("#strip-main-04-bands", {autoAlpha:0}, 24/30);
      window.__timelines["strip-main-04"] = tl;
    })();
